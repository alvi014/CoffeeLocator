<div class="relative min-h-screen flex items-center justify-center p-6 bg-coffee-dark overflow-hidden font-sans">
  
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=2070" 
         class="w-full h-full object-cover opacity-25 grayscale-[20%]" alt="coffee background">
    <div class="absolute inset-0 bg-gradient-to-b from-coffee-dark/40 via-coffee-dark/80 to-coffee-dark"></div>
  </div>

  <div class="relative z-10 w-full max-w-[480px]">
    <div class="flex flex-col items-center mb-10 group">
      <div class="relative w-20 h-20 bg-gradient-to-br from-coffee-gold to-amber-900 rounded-2xl flex items-center justify-center shadow-2xl shadow-coffee-gold/20 transition-transform duration-500 group-hover:scale-110">
        <div class="relative w-10 h-8 border-2 border-white rounded-b-xl">
          <div class="absolute -right-3 top-1 w-4 h-4 border-2 border-white rounded-full"></div>
          <div class="absolute -top-4 left-2 w-0.5 h-3 bg-white/60 rounded-full animate-bounce"></div>
          <div class="absolute -top-3 left-4 w-0.5 h-2 bg-white/40 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        </div>
      </div>
      <h1 class="mt-6 text-4xl font-black text-white tracking-tighter uppercase text-center">
        Coffee<span class="text-coffee-gold">Locator</span>
      </h1>
      <div class="h-1 w-12 bg-coffee-gold rounded-full mt-2 transform origin-left group-hover:w-24 transition-all duration-500"></div>
    </div>

    <div class="bg-coffee-card/85 backdrop-blur-xl border border-white/10 p-10 rounded-3xl shadow-2xl relative overflow-hidden">
      
      <div *ngIf="errorMessage" 
           class="absolute top-0 left-0 right-0 bg-red-600 text-white text-[10px] font-black uppercase tracking-[2px] py-2 text-center shadow-lg z-20 animate-pulse">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-4">
          <div>
            <label class="block text-zinc-400 text-[10px] font-black uppercase tracking-[2px] mb-2 ml-1">Email Address</label>
            <input formControlName="email" type="email" 
              class="w-full bg-black/40 border border-white/5 text-white p-4 rounded-2xl outline-none focus:ring-2 focus:ring-coffee-gold/50 focus:border-coffee-gold transition-all placeholder-zinc-700"
              placeholder="barista@coffee.com">
          </div>
          <div>
            <label class="block text-zinc-400 text-[10px] font-black uppercase tracking-[2px] mb-2 ml-1">Password</label>
            <input formControlName="password" type="password" 
              class="w-full bg-black/40 border border-white/5 text-white p-4 rounded-2xl outline-none focus:ring-2 focus:ring-coffee-gold/50 focus:border-coffee-gold transition-all"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid"
          class="group relative w-full h-16 overflow-hidden rounded-2xl bg-coffee-gold font-black uppercase tracking-widest text-coffee-dark transition-all duration-300 hover:shadow-[0_0_30px_rgba(217,154,78,0.3)] active:scale-95 disabled:opacity-40 disabled:grayscale">
          
          <div class="absolute inset-0 w-1/2 h-full bg-white/20 skew-x-[-25deg] -translate-x-[150%] group-hover:animate-[shimmer_1.5s_infinite]"></div>
          
          <span class="relative z-10 flex items-center justify-center gap-2">
            Sign In 
            <span class="text-lg group-hover:translate-x-1 transition-transform">→</span>
          </span>
        </button>

        <p class="text-center text-zinc-500 text-xs font-bold uppercase tracking-widest mt-6">
          ¿Nuevo por aquí? 
          <a routerLink="/register" class="text-coffee-gold hover:text-white transition-colors border-b-2 border-coffee-gold/30 hover:border-coffee-gold ml-1">
            Crea una cuenta
          </a>
        </p>
      </form>
    </div>
  </div>
</div>
